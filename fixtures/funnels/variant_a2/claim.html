<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>ExampleMart — Verify Cashback Recipient</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f7ff; color: #1e293b; margin: 0; padding: 20px; text-align: center; }
    .card { max-width: 480px; margin: 40px auto; background: white; border-radius: 16px; padding: 32px; box-shadow: 0 10px 25px rgba(2,132,199,0.1); border: 2px solid #bae6fd; text-align: left; }
    h2 { color: #0284c7; font-size: 20px; margin-top: 0; text-align: center; }
    label { font-size: 13px; font-weight: 600; color: #475569; display: block; margin-top: 14px; }
    input { width: 100%; box-sizing: border-box; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; margin-top: 6px; font-size: 15px; }
    .btn { display: block; width: 100%; box-sizing: border-box; background: #0284c7; color: white; padding: 14px; border-radius: 10px; text-decoration: none; font-weight: bold; font-size: 16px; margin-top: 24px; border: none; cursor: pointer; text-align: center; }
    .btn:hover { background: #0369a1; }
    footer { margin-top: 32px; font-size: 11px; color: #777; border-top: 1px solid #eee; padding-top: 16px; text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Recipient Identity Check</h2>
    <form action="pay.html" method="GET">
      <label for="name">Beneficiary Name</label>
      <input type="text" id="name" name="name" placeholder="Full Name as per Bank Account" required>

      <label for="phone">Registered Mobile Number</label>
      <input type="tel" id="phone" name="phone" placeholder="+91 98765 43210" required>

      <button type="submit" class="btn">Proceed to Disbursal Setup &rarr;</button>
    </form>
    <footer>
      Synthetic STING test funnel - not a real service. Do not pay.
    </footer>
  </div>
</body>
</html>
