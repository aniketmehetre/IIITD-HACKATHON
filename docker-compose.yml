version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sting-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: sting_db
    ports:
      - "5432:5432"
    volumes:
      - sting_pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sting_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  sting_pgdata:
