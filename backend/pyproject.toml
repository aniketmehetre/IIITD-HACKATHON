[tool.poetry]
name = "sting-backend"
version = "0.1.0"
description = "STING: Autonomous multi-agent scam detection and detonation pipeline"
authors = ["Team void main <team@voidmain.local>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = ">=0.110.0"
uvicorn = {extras = ["standard"], version = ">=0.28.0"}
pydantic = ">=2.6.0"
pydantic-settings = ">=2.2.0"
httpx = ">=0.27.0"
python-dotenv = ">=1.0.1"
sqlalchemy = ">=2.0.28"
asyncpg = ">=0.29.0"
aiosqlite = ">=0.20.0"
redis = ">=5.0.3"
networkx = ">=3.2.1"
python-multipart = ">=0.0.9"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.1.0"
pytest-asyncio = ">=0.23.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["..", "."]
