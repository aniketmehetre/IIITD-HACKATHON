[tool.poetry]
name = "sting-backend"
version = "0.1.0"
description = "STING: Autonomous multi-agent scam detection and detonation pipeline"
authors = ["Team void main <team@voidmain.local>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = ">=0.110.0"
uvicorn = {extras = ["standard"], version = ">=0.28.0"}
pydantic-settings = ">=2.2.0"
sqlalchemy = {extras = ["asyncio"], version = ">=2.0.28"}
asyncpg = ">=0.29.0"
alembic = ">=1.13.0"
httpx = ">=0.27.0"
tinyfish = "0.11.0"
opencv-python-headless = ">=4.9.0.80"
reportlab = ">=4.1.0"
python-multipart = ">=0.0.9"
slowapi = ">=0.1.9"
pyyaml = ">=6.0.1"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
pytest-asyncio = ">=0.23.0"
respx = ">=0.21.0"
ruff = ">=0.3.0"
jsonschema = ">=4.21.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", ".."]
